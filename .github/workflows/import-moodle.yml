name: Import Moodle and smoke test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - '.github/workflows/import-moodle.yml'
      - 'moodle/theme/seavan/**'
      - 'moodle/my/**'
      - 'moodle/course/index.php'
      - 'moodle/course/view.php'
      - 'moodle/local/seavan/**'
      - 'moodle/local/seavanmedia/**'
      - 'tests/**'
      - '.devcontainer/**'
      - 'docker/**'
      - '*.ps1'
      - 'compose*.yaml'
      - 'docs/**'
      - '*.cmd'
      - 'docker/**'
      - 'Dockerfile'
      - 'compose.yaml'
permissions:
  contents: read
concurrency:
  group: moodle-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified official source
        shell: bash
        run: |
          set -euo pipefail
          test -f moodle/version.php
      - name: Build and initialize test site
        id: site_ready
        shell: bash
        run: |
          set -euo pipefail
          printf 'BIND_IP=127.0.0.1\nSITE_URL=http://127.0.0.1:8080\nADMIN_EMAIL=admin@example.invalid\nADMIN_PASSWORD=Aa1!%s\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          mkdir -p "courses/CI Media Course/Chapter 1"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=navy:s=320x180:r=5 -t 20 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "courses/CI Media Course/Chapter 1/01 - Sample.mp4"
          mkdir -p "courses/CI Collection/Other Course/فصل ۲" "courses/CI Collection/Other Course/فصل ۱۰" "courses/CI ignored"
          touch "courses/CI Collection/.seavan-category" "courses/CI ignored/.seavan-ignore"
          cp "courses/CI Media Course/Chapter 1/01 - Sample.mp4" "courses/CI Collection/Other Course/فصل ۲/۲ - Example.mp4"
          cp "courses/CI Media Course/Chapter 1/01 - Sample.mp4" "courses/CI Collection/Other Course/فصل ۱۰/۱۰ - Example.mp4"
          cp "courses/CI Media Course/Chapter 1/01 - Sample.mp4" "courses/CI ignored/hidden.mp4"
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=navy:s=320x180:r=10 -t 20 -c:v libvpx -an "courses/CI Media Course/Chapter 1/02 - Browser.webm"
          printf 'WEBVTT\n\n00:00:00.000 --> 00:00:05.000\nSample subtitle\n' > "courses/CI Media Course/Chapter 1/02 - Browser.en.vtt"
          find courses -type f -exec touch -d '5 minutes ago' {} +
          touch -d '5 minutes ago' "courses/CI Media Course/Chapter 1/01 - Sample.mp4"
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login/index.php -o /tmp/login.html; then
              grep -Eq 'lang="fa(-[A-Za-z]+)?"' /tmp/login.html
              grep -q 'dir="rtl"' /tmp/login.html
              grep -q 'seavan' /tmp/login.html
              docker compose exec -T web php -l /var/www/html/local/seavan/index.php
              docker compose exec -T web php -l /var/www/html/theme/seavan/config.php
              curl -fsSL http://127.0.0.1:8080/local/seavan/index.php -o /tmp/academy-login.html
              grep -q 'lang="fa' /tmp/academy-login.html
              break
            fi
            sleep 5
          done
          grep -q 'lang="fa' /tmp/login.html
          docker compose exec -T web sh -c 'find /var/www/html/theme/seavan /var/www/html/local/seavan -name "*.php" -exec php -l {} \;'
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, re, html
          env = dict(line.strip().split('=', 1) for line in open('.env') if '=' in line)
          base = 'http://127.0.0.1:8080'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(path):
              return opener.open(base + path, timeout=90).read().decode('utf-8')
          login = get('/login/index.php')
          token = re.search(r'name="logintoken"[^>]*value="([^"]+)"', login)
          assert token, 'No login token in Moodle'
          body = urllib.parse.urlencode({'username':'admin','password':env['ADMIN_PASSWORD'],'logintoken':html.unescape(token.group(1))}).encode()
          opener.open(base + '/login/index.php', body, timeout=90).read()
          for view, expected in [('/my/index.php','sa-welcome'),('/my/courses.php','seavan-grid'),('/course/index.php','seavan-grid'),('/local/seavan/index.php?view=manage','seavan-actions')]:
              page = get(view)
              assert expected in page, 'Academy route failed: ' + view
              assert page.count('class="sa-main-nav"') == 1, 'Academy must have exactly one primary menu'
              assert 'class="seavan-nav"' not in page, 'Duplicate menu rendered'
              assert 'drawer-toggles' not in page, 'Unwanted drawer controls rendered'
              menu = re.search(r'<nav class="sa-main-nav".*?</nav>', page, re.S)
              assert menu and menu[0].count('<a ') == 3, 'Expected only two learning destinations and management'
              assert 'seavan-login-story' not in page, 'Login failed'
          print('Authenticated Academy routes passed.')
          PY
          docker compose exec -T web sh -c 'find /var/www/html/local/seavanmedia -name "*.php" -print0 | xargs -0 -n1 php -l'
          node --check moodle/local/seavanmedia/amd/build/player.min.js
          docker compose exec -T -u www-data web php /var/www/html/admin/cli/scheduled_task.php --execute='\local_seavanmedia\task\discover'
          docker compose exec -T -u www-data web php /var/www/html/admin/cli/scheduled_task.php --execute='\local_seavanmedia\task\discover'
          docker compose exec -T -u www-data web php /var/www/html/local/seavanmedia/cli/media.php --action=probe --limit=20
          docker compose exec -T web sh -c 'test -n "$(find /var/moodledata/seavan-assets -name cover.jpg -print -quit)"'
          python3 tests/media-smoke.py
      - name: Test real browser video playback
        run: |
          python3 -m venv /tmp/seavan-browser
          /tmp/seavan-browser/bin/pip install playwright==1.51.0
          /tmp/seavan-browser/bin/python -m playwright install --with-deps chromium
          /tmp/seavan-browser/bin/python tests/player-browser.py
      - name: Save UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
      - name: Test learner access and concurrent media requests
        if: ${{ !cancelled() && steps.site_ready.outcome == 'success' }}
        run: |
          docker compose exec -T -u www-data web php < tests/security-fixture.php > /tmp/security-fixture.json
          python3 tests/security-load.py /tmp/security-fixture.json
      - name: Test secure HTTPS proxy-mode login
        if: ${{ !cancelled() && steps.site_ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash -n .devcontainer/recover-preview.sh .devcontainer/update-preview.sh
          sed -i 's|^SITE_URL=.*|SITE_URL=https://academy.preview.test|' .env
          printf '\nSSL_PROXY=1\n' >> .env
          docker compose up -d --no-build --no-deps --force-recreate web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/login/index.php -o /tmp/proxy-login.html; then break; fi
            sleep 2
          done
          old_password="$(grep '^ADMIN_PASSWORD=' .env | cut -d= -f2-)"
          SEAVAN_TEST_PASSWORD="$old_password" python3 tests/preview-login.py --origin https://academy.preview.test --port 8080
          export SEAVAN_TEST_PASSWORD="Aa1!$(openssl rand -hex 24)"
          docker compose exec -T -e SEAVAN_TEST_PASSWORD -u www-data web php < .devcontainer/reset-preview-admin.php
          python3 tests/preview-login.py --origin https://academy.preview.test --port 8080
          SEAVAN_TEST_PASSWORD="$old_password" python3 tests/preview-login.py --origin https://academy.preview.test --port 8080 --expect-denied
      - name: Clean test environment
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=80 init web || true
          docker compose down -v || true
          rm -f .env
