name: Academy Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/preview.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - uses: actions/deploy-pages@v4
        id: deployment
