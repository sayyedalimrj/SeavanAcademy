<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>آکادمی سیوان — پیش‌نمایش</title>
<style>
:root{--ink:#203831;--green:#176b60;--dark:#174e45;--bg:#f4f7f6;--line:#dce7e3;--muted:#60766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.85 IRANSansWeb,IRANSans,Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d6a14d;outline-offset:3px}
.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(4vw,20px);background:#fff;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:17px}.mark{background:var(--green);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:bold 25px Arial}.brand small{display:block;font:10px Arial;letter-spacing:2px;color:var(--muted)}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button,.plain{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px}.nav button.active{background:#e8f3ee;color:var(--green);font-weight:bold}.profile{display:flex;align-items:center;gap:8px;white-space:nowrap}.avatar{width:34px;height:34px;background:#e8f3ee;border-radius:50%;display:grid;place-items:center;color:var(--green)}.notice{padding:7px 4vw;background:#f8efd9;color:#735a27;text-align:center;font-size:11px}.wrap{max-width:1220px;margin:auto;padding:32px 24px 50px}.hero{border-radius:23px;background:var(--dark);color:white;padding:32px 38px;display:flex;align-items:center;justify-content:space-between;gap:30px;overflow:hidden}.hero h1{font-size:clamp(25px,4vw,36px);margin:8px 0;line-height:1.55}.hero p{color:#d2e8e1;max-width:550px;margin:8px 0 22px}.eyebrow{font-size:12px;color:#b9ddd2}.hero-visual{width:230px;max-width:30%;opacity:.9}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:9px 18px;text-decoration:none;font-weight:bold}.btn.light{background:white;color:var(--dark);border-color:white}.btn.outline{background:white;color:var(--green);border-color:var(--line)}.btn:hover{filter:brightness(.94)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 16px}.section-head h2{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin:2px 0}.search{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;min-width:230px;max-width:100%}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--line);background:white;padding:6px 13px;border-radius:20px;color:var(--muted)}.chip.active{background:#e3f1eb;border-color:#c5dfd3;color:var(--green);font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.cover{height:126px;display:flex;justify-content:space-between;align-items:center;padding:20px;color:#fff;position:relative}.cover .symbol{font:54px Arial;font-weight:bold;opacity:.85}.cover small{font-size:12px;color:inherit;align-self:flex-start}.cover.office{background:linear-gradient(135deg,#2f7a68,#174e45)}.cover.tech{background:linear-gradient(135deg,#526c91,#314a70)}.cover.project{background:linear-gradient(135deg,#a98653,#725735)}.cover.soft{background:linear-gradient(135deg,#7a718f,#51465e)}.card-body{padding:16px}.card h3{font-size:16px;line-height:1.7;margin:5px 0 9px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.bar{height:7px;border-radius:10px;background:#e8eeeb;margin:10px 0 14px;overflow:hidden}.bar span{background:var(--green);height:100%;display:block;border-radius:10px}.card .btn{width:100%}.panel{border:1px solid var(--line);background:white;border-radius:16px;padding:22px;margin:16px 0}.panel h2,.panel h3{margin-top:0}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{padding:18px;text-align:right;border:1px solid var(--line);background:white;border-radius:14px;color:var(--ink)}.tile b{display:block;color:var(--green);font-size:15px}.tile small{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}th,td{padding:13px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.empty{padding:30px;text-align:center;background:white;border:1px dashed var(--line);border-radius:14px}.detail{display:grid;grid-template-columns:2fr 1fr;gap:16px}.player{background:#18352f;border-radius:15px;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:#d7eae3;padding:18px}.playicon{font-size:44px;line-height:1.2}.lesson{display:flex;gap:8px;align-items:center;width:100%;text-align:right;background:white;border:0;border-bottom:1px solid var(--line);padding:12px}.lesson.active{background:#e8f3ee;border-radius:8px}.lesson span{margin-right:auto;color:var(--green)}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}.modal{border:1px solid var(--line);border-radius:18px;padding:24px;max-width:90vw;width:430px;color:var(--ink)}.modal::backdrop{background:#102c26a0}.modal label{display:block;margin:12px 0 5px}.modal input,.modal select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.modal .buttons{display:flex;gap:8px;margin-top:18px}.toast{background:var(--dark);color:white;position:fixed;bottom:20px;left:20px;padding:12px 20px;border-radius:12px;box-shadow:0 5px 25px #0002;z-index:3}.hidden{display:none!important}
@media(max-width:840px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,1fr)}.profile span:not(.avatar){display:none}.hero{padding:25px}.detail{grid-template-columns:1fr}}@media(max-width:560px){.top{height:auto;padding:12px;flex-wrap:wrap}.nav{order:3;width:100%;justify-content:center}.nav button{padding:7px 10px;font-size:12px}.wrap{padding:18px 13px}.hero-visual{display:none}.grid{grid-template-columns:1fr}.section-head .search{width:100%}.tiles{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
</style></head>
<body><header class="top"><div class="brand"><span class="mark">S</span><div>آکادمی سیوان<small>SEAVAN ACADEMY</small></div></div><nav class="nav" aria-label="منو"><button data-page="home" class="active">خانه</button><button data-page="catalog">کتابخانه</button><button data-page="mine">دوره‌های من</button><button data-page="admin">مدیریت</button></nav><div class="profile"><span class="avatar">ه</span><span>همکار نمونه</span></div></header>
<div class="notice">پیش‌نمایش تعاملی طراحی — همه اطلاعات فرضی هستند؛ به سرور و حساب واقعی متصل نیست.</div>
<main class="wrap" id="main"></main><dialog class="modal" id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><div class="buttons"><button type="submit" class="btn">ثبت نمونه</button><button type="button" class="btn outline" id="close">انصراف</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const initial=[
{id:1,title:'آشنایی با اصول متره و برآورد',category:'دفتر فنی',type:'tech',symbol:'∑',duration:'۸ ساعت',lessons:12,progress:42,enrolled:true},
{id:2,title:'اکسل کاربردی برای امور مهندسی',category:'نرم‌افزار',type:'office',symbol:'▦',duration:'۶ ساعت',lessons:9,progress:20,enrolled:true},
{id:3,title:'مدیریت پروژه‌های عمرانی',category:'مدیریت پروژه',type:'project',symbol:'▤',duration:'۴ ساعت',lessons:7,progress:0,enrolled:true},
{id:4,title:'آشنایی با AutoCAD',category:'نرم‌افزار',type:'tech',symbol:'⌗',duration:'۱۰ ساعت',lessons:16,progress:0,enrolled:false},
{id:5,title:'مستندسازی و بایگانی پروژه',category:'دفتر فنی',type:'project',symbol:'▱',duration:'۳ ساعت',lessons:5,progress:0,enrolled:false},
{id:6,title:'ارتباط مؤثر در محیط کار',category:'مهارت فردی',type:'soft',symbol:'◎',duration:'۲ ساعت',lessons:4,progress:100,enrolled:true}
];
let courses=initial.map(x=>({...x})),people=[{name:'همکار نمونه ۱',group:'دفتر فنی'},{name:'همکار نمونه ۲',group:'اجرایی'}],page='home',filter='همه',q='',selected=null,lesson=0,mode='';
const main=document.querySelector('#main'),modal=document.querySelector('#modal'),form=document.querySelector('#form');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');const footer='<div class="foot">آکادمی سیوان • یادگیری ساده، هر روز بهتر</div>';
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function go(p){page=p;filter='همه';q='';render();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function hero(){return '<div class="hero"><div><span class="eyebrow">فضای یادگیری همکاران</span><h1>سلام، به آکادمی سیوان خوش اومدی!</h1><p>مهارت‌های تازه یاد بگیر، آموزش‌های مورد نیازت رو پیدا کن و با سرعت خودت پیش برو.</p><button class="btn light" id="browse">مشاهده آموزش‌ها</button></div><svg class="hero-visual" viewBox="0 0 230 160" aria-hidden="true"><g fill="none" stroke="#b9ddd2" stroke-width="2"><rect x="25" y="13" width="179" height="114" rx="13" fill="#24675b"/><path d="M43 36h143M43 48h63M43 60h63M43 72h42"/><rect x="120" y="48" width="66" height="48" rx="7" fill="#e2efe9"/><path d="m144 61 21 11-21 11z" fill="#176b60" stroke="none"/><path d="M8 128h213l-13 16H22z" fill="#92bdaf"/><circle cx="201" cy="17" r="10" fill="#c8a66f" stroke="none"/></g></svg></div>'}
function card(c){return '<article class="card"><div class="cover '+c.type+'"><small>'+esc(c.category)+'</small><span class="symbol">'+esc(c.symbol)+'</span></div><div class="card-body"><h3>'+esc(c.title)+'</h3><div class="meta"><span>'+esc(c.duration)+' • '+fa(c.lessons)+' جلسه</span><span>'+(c.enrolled?fa(c.progress)+'٪':'جدید')+'</span></div><div class="bar" role="progressbar" aria-valuenow="'+c.progress+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+c.progress+'%"></span></div><button class="btn '+(c.progress===0?'outline':'')+'" data-course="'+c.id+'">'+(c.progress===100?'مرور دوره':c.progress?'ادامه یادگیری':'مشاهده دوره')+'</button></div></article>'}
function list(){let base=page==='catalog'?courses:courses.filter(c=>c.enrolled);let shown=base.filter(c=>(filter==='همه'||c.category===filter)&&c.title.includes(q));return shown.length?shown.map(card).join(''):'<div class="empty">دوره‌ای پیدا نشد.</div>'}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='detail'){detail();return}if(page==='admin'){admin();return}let title=page==='catalog'?'کتابخانه آموزش‌ها':'دوره‌های من';main.innerHTML=(page==='home'?hero():'')+'<div class="section-head"><div><h2>'+title+'</h2><p class="sub">آموزش‌های مورد نیازت رو راحت پیدا کن.</p></div><input class="search" id="search" type="search" placeholder="جست‌وجوی دوره..." aria-label="جست‌وجوی دوره"></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div>'+footer;let b=document.querySelector('#browse');if(b)b.onclick=()=>go('catalog');let input=document.querySelector('#search');input.value=q;input.oninput=e=>{q=e.target.value;refresh()};let categories=['همه',...new Set(courses.map(c=>c.category))];document.querySelector('#chips').innerHTML=categories.map(c=>'<button class="chip" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;refresh()});refresh()}
function refresh(){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.querySelector('#grid').innerHTML=list();document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=courses.find(c=>c.id===+b.dataset.course);lesson=0;page='detail';render();window.scrollTo(0,0)})}
function detail(){const c=selected;main.innerHTML='<button class="plain" id="back">← بازگشت به کتابخانه</button><div class="section-head"><div><p class="sub">'+esc(c.category)+'</p><h2>'+esc(c.title)+'</h2></div><span>'+esc(c.duration)+' • '+fa(c.lessons)+' جلسه</span></div><div class="detail"><section class="panel"><div class="player"><div><div class="playicon">▷</div>پیش‌نمایش محل نمایش ویدئو<br><small>فایل واقعی در سرور داخلی بارگذاری می‌شود.</small></div></div><h3 style="margin-top:18px">جلسه '+fa(lesson+1)+'</h3><p class="sub">این جلسه نمونه است و ویدئوی واقعی ندارد.</p><button id="done" class="btn">'+(c.enrolled?'علامت‌گذاری جلسه به‌عنوان مطالعه‌شده':'افزودن به دوره‌های من (نمونه)')+'</button></section><aside class="panel"><h3>جلسات دوره</h3><div class="meta">پیشرفت <b>'+fa(c.progress)+'٪</b></div><div class="bar"><span style="width:'+c.progress+'%"></span></div>'+Array.from({length:c.lessons},(_,i)=>'<button class="lesson '+(i===lesson?'active':'')+'" data-lesson="'+i+'">جلسه '+fa(i+1)+' <span>'+(i<Math.floor(c.progress*c.lessons/100)?'✓':'▷')+'</span></button>').join('')+'</aside></div>'+footer;document.querySelector('#back').onclick=()=>go('catalog');document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{lesson=+b.dataset.lesson;detail()});document.querySelector('#done').onclick=()=>{if(!c.enrolled){c.enrolled=true}else{c.progress=Math.max(c.progress,Math.round((lesson+1)*100/c.lessons))}detail();toast('تغییر نمونه ثبت شد')}}
function admin(){main.innerHTML='<div class="section-head"><div><h2>مدیریت آموزش</h2><p class="sub">همه کارهای اصلی در چند کلیک.</p></div></div><div class="tiles"><button class="tile" data-mode="course"><b>＋ افزودن دوره</b><small>عنوان و دسته‌بندی</small></button><button class="tile" data-mode="user"><b>＋ افزودن همکار</b><small>نام و واحد سازمانی</small></button><button class="tile" data-mode="assign"><b>اختصاص دوره</b><small>انتخاب کاربر و دوره</small></button><button class="tile" data-mode="report"><b>گزارش آموزش</b><small>فعالیت و پیشرفت نمونه</small></button></div><section class="panel"><h3>دوره‌ها ('+fa(courses.length)+')</h3><div class="tablewrap"><table><thead><tr><th>عنوان دوره</th><th>دسته‌بندی</th><th>جلسات</th></tr></thead><tbody>'+courses.map(c=>'<tr><td>'+esc(c.title)+'</td><td>'+esc(c.category)+'</td><td>'+fa(c.lessons)+'</td></tr>').join('')+'</tbody></table></div></section><section class="panel"><h3>همکاران ('+fa(people.length)+')</h3><div class="tablewrap"><table><thead><tr><th>نام</th><th>واحد</th></tr></thead><tbody>'+people.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.group)+'</td></tr>').join('')+'</tbody></table></div></section>'+footer;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>openModal(b.dataset.mode))}
function openModal(m){mode=m;let title=document.querySelector('#modalTitle'),fields=document.querySelector('#fields');const select=(name,options)=>'<select name="'+name+'">'+options.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join('')+'</select>';if(m==='course'){title.textContent='افزودن دوره';fields.innerHTML='<label>عنوان دوره</label><input name="name" required maxlength="80"><label>دسته‌بندی</label><input name="category" required maxlength="50">'}else if(m==='user'){title.textContent='افزودن همکار';fields.innerHTML='<label>نام نمایشی</label><input name="name" required maxlength="80"><label>واحد</label><input name="group" required maxlength="50">'}else if(m==='assign'){title.textContent='اختصاص دوره (نمونه)';fields.innerHTML='<label>همکار</label>'+select('user',people.map(p=>p.name))+'<label>دوره</label>'+select('course',courses.map(c=>c.title))}else{title.textContent='گزارش نمونه';fields.innerHTML='<p>آخرین فعالیت: همکار نمونه • امروز</p><p>دوره‌های تکمیل‌شده: '+fa(courses.filter(c=>c.progress===100).length)+'</p><p class="sub">در مودل، گزارش واقعی از لاگ‌ها و تکمیل فعالیت استخراج می‌شود.</p>'}modal.showModal()}
document.querySelector('#close').onclick=()=>modal.close();form.onsubmit=e=>{e.preventDefault();let d=new FormData(form);if(mode==='course')courses.push({id:Date.now(),title:d.get('name'),category:d.get('category'),type:'office',symbol:'▦',duration:'—',lessons:1,progress:0,enrolled:false});if(mode==='user')people.push({name:d.get('name'),group:d.get('group')});if(mode==='assign')courses[+d.get('course')].enrolled=true;modal.close();admin();toast(mode==='report'?'گزارش نمونه بسته شد':'تغییر نمونه ثبت شد')};
render();
</script></body></html>
